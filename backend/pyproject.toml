[project]
name = "spotter-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "django==6.1.2",
    "django-environ==0.14.0",
    "djangorestframework==3.18.3",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "polyline==2.0.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
