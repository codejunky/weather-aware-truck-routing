services:
  - type: web
    name: spotter-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.15.0
      - key: UV_VERSION
        value: 0.11.16
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
